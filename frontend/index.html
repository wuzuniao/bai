<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<script>
			var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
				CSS.supports('top: constant(a)'))
			document.write(
				'<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
				(coverSupport ? ', viewport-fit=cover' : '') + '" />')
		</script>
		<link rel="icon" href="/static/favicon.ico" />
		<style>
			/* H5 端 PC 浏览器最大宽度限制居中（对齐 yao 项目 global.scss 同名方案）：
			 * PC 宽屏时页面铺满全屏导致布局错位，限制 body 最大宽度 480px 居中，
			 * html 背景色取页面画布色（与 uni.scss 的 $bai-canvas-soft 保持一致）避免两侧突兀；
			 * 移动端 H5（<768px）不触发，保持原始全屏自适应。
			 * 仅 Web 构建使用本模板，小程序/App 端不受影响。 */
			@media screen and (min-width: 768px) {
				html {
					background-color: #f4f4f2;
				}
				/* html body 提升优先级，防止框架运行时注入的基础样式覆盖 */
				html body {
					max-width: 480px;
					margin: 0 auto;
					box-shadow: 0 0 12px rgba(0, 0, 0, 0.08);
				}
			}
			/* 阅读页（reader）解除限宽全屏阅读：页面在 WEB 端按生命周期切换 body 类名 */
			html body.reader-full {
				max-width: none;
				box-shadow: none;
			}
		</style>
		<title></title>
		<!--preload-links-->
		<!--app-context-->
	</head>
	<body>
		<div id="app"><!--app-html--></div>
		<script type="module" src="/main"></script>
	</body>
</html>
